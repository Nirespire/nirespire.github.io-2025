name: Update Webmentions

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

# Serialise commits to main: overlapping runs would race on the push
concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  update-webmentions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch webmentions
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: node scripts/fetch-webmentions.js

      - name: Commit and push changes
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Checkout ran with persist-credentials: false, so the write token was
          # never in .git/config while npm ci ran dependency install scripts.
          # Authenticate git for this step only, via environment-scoped config.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/_data/webmentions.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update webmentions data"
            git push
            echo "changes_made=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "changes_made=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy workflow
        if: steps.commit.outputs.changes_made == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
