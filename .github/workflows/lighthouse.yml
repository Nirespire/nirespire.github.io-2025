name: Lighthouse CI
permissions:
  contents: read

on:
  # No `branches:` filter — stacked PRs target their parent branch rather than
  # `main`, and must run the same gate at every level of the stack.
  pull_request:

# Supersede in-flight runs when a PR branch is pushed again — only the newest
# commit's Lighthouse result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Budgets and score thresholds live in lighthouserc.json. Resource-size
      # budgets (image/css/html weight per page) are hard errors; category
      # scores and LCP are warnings since they can flake on shared runners.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
