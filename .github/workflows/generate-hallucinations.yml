name: Generate Blog Hallucinations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/blog/**'

# Serialise commits to main: overlapping runs would race on the push
concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  generate-hallucinations:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Install Claude CLI
        run: npm install --no-save @anthropic-ai/claude-code

      - name: Verify Claude CLI
        run: npx claude --version

      - name: Generate hallucinations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-hallucinations.js
        
      - name: Commit and push changes
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Checkout ran with persist-credentials: false, so the write token was
          # never in .git/config while npm ci ran dependency install scripts.
          # Authenticate git for this step only, via environment-scoped config.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data/hallucinations.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update blog hallucinations"
            # main moves during generation (merge bursts); rebase and retry
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              sleep $((i * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push after 3 attempts"
              exit 1
            fi
            echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy workflow
        if: steps.commit.outputs.changes_made == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })