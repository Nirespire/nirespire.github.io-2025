name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip bot-authored PRs (Dependabot). claude-code-action rejects non-human
    # actors unless they are listed in `allowed_bots`, and allow-listing alone
    # would only move the failure: Dependabot-triggered runs read the Dependabot
    # secret store rather than Actions secrets, so `CLAUDE_CODE_OAUTH_TOKEN`
    # arrives empty and the action has no credentials. A skipped job reports as
    # neutral instead of failing, so it no longer blocks dependabot-automerge;
    # `verify` and Lighthouse still gate those PRs.
    if: github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    # Every other job in this repo is bounded; without this an agent run that
    # hangs holds a runner for the 360-minute GitHub default.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

