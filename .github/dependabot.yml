version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Collapse the daily churn into two PRs instead of one-per-package: the
    # dependabot-automerge workflow still auto-merges the grouped minor/patch
    # bumps, while a grouped major surfaces as a single review.
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    # typescript 7 breaks `npm ci` (ERESOLVE): typescript-eslint's peer range
    # is `typescript <6.1.0`. Drop this once typescript-eslint supports TS 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
